name: dbt CI/CD

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]
  schedule:
    - cron: "0 9 * * *"  # Runs every day at 00:00 UTC
  workflow_dispatch:      # Allow manual triggering

jobs:
  dbt-ci-cd:
    runs-on: ubuntu-latest
    env:
      BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
      BIGQUERY_DEV_DATASET: ${{ secrets.BIGQUERY_DEV_DATASET }}
      BIGQUERY_PROD_DATASET: ${{ secrets.BIGQUERY_PROD_DATASET }}
      BIGQUERY_KEYFILE_JSON: ${{ secrets.BIGQUERY_SERVICE_ACCOUNT }}
      # Default to prod for schedules/manual runs, else choose based on branch
      DBT_TARGET: ${{ github.event_name == 'schedule' && 'prod' || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-core dbt-bigquery

      - name: Create service account key file
        run: echo "$BIGQUERY_KEYFILE_JSON" > ${GITHUB_WORKSPACE}/keyfile.json

      - name: Create dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          echo "bigquery_transform:" > ~/.dbt/profiles.yml
          echo "  target: $DBT_TARGET" >> ~/.dbt/profiles.yml
          echo "  outputs:" >> ~/.dbt/profiles.yml
          echo "    dev:" >> ~/.dbt/profiles.yml
          echo "      type: bigquery" >> ~/.dbt/profiles.yml
          echo "      method: service-account" >> ~/.dbt/profiles.yml
          echo "      project: $BIGQUERY_PROJECT" >> ~/.dbt/profiles.yml
          echo "      dataset: $BIGQUERY_DEV_DATASET" >> ~/.dbt/profiles.yml
          echo "      threads: 4" >> ~/.dbt/profiles.yml
          echo "      keyfile: ${GITHUB_WORKSPACE}/keyfile.json" >> ~/.dbt/profiles.yml
          echo "    prod:" >> ~/.dbt/profiles.yml
          echo "      type: bigquery" >> ~/.dbt/profiles.yml
          echo "      method: service-account" >> ~/.dbt/profiles.yml
          echo "      project: $BIGQUERY_PROJECT" >> ~/.dbt/profiles.yml
          echo "      dataset: $BIGQUERY_PROD_DATASET" >> ~/.dbt/profiles.yml
          echo "      threads: 4" >> ~/.dbt/profiles.yml
          echo "      keyfile: ${GITHUB_WORKSPACE}/keyfile.json" >> ~/.dbt/profiles.yml

      - name: Test connection
        run: dbt debug --target $DBT_TARGET

      - name: Install dbt packages
        run: dbt deps

      - name: Run models
        run: dbt run --target $DBT_TARGET

      - name: Run tests
        run: dbt test --target $DBT_TARGET
